issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: MY_GITHUB_CLIENT_ID
      clientSecret: MY_GITHUB_CLIENT_SECRET
      redirectURI: http://localhost:5556/dex/callback

enablePasswordDB: true
staticPasswords:
  - email: "user@example.com"
    # Generate a bcrypt hash (replace the password), e.g.:
    # uv run --no-project --with bcrypt python -c "import bcrypt; print(bcrypt.hashpw(b'DEIN_PASSWORT', bcrypt.gensalt(10)).decode())"
    hash: "REPLACE_WITH_BCRYPT_HASH"
    username: "user"
    userID: "0815"

staticClients:
  - id: fastapi-app
    redirectURIs:
      - 'http://localhost:8000/auth/callback'
    name: 'My FastAPI Application'
    secret: a-safe-password
